# 2026-11-23: C 盘已满，临时目录强制走 F 盘（\t 是 Tab，必须用正斜杠）
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=F:/tmp
android.useAndroidX=true
android.enableJetifier=true
# org.gradle.java.home 不硬编码：本地用 JAVA_HOME=D:\Java\jdk-17，CI 用 setup-java 注入的 Linux JDK。
# 之前写死 D:/Program Files/Java/jdk-17 导致 Linux runner 报 "Java home supplied is invalid"。
kotlin.daemon.jvm.options=-Xmx2G -Djava.io.tmpdir=F:/tmp
# GRADLE_USER_HOME 由构建脚本以环境变量指定为 F:\gradle-home（此处写无效）
