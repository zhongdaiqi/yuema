name: iOS Build (unsigned)

# 目的：在没有 Mac 的前提下，用 GitHub macOS runner 把 yuema Flutter 工程
#       编译出 iOS App（未签名）。用于快速验证「能编译过 / 依赖能解析」，
#       不上传苹果，不计费昂贵的签名与 TestFlight 上传。
#
# 触发：手动，或推到 main。刻意不挂 tag：macOS runner 计费是 Linux 的 ~10 倍。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'ohos/**'
      - 'android/**'
      - '发布/**'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与本地 OHOS fork 的 Flutter 版本一致（3.41.9），与 ios-release.yml 同步。
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-ios:
    name: 构建 iOS（未签名）
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境信息（排错用）
        run: |
          flutter --version
          echo "--- Xcode ---"
          xcodebuild -version

      # 关键：pubspec 里把若干插件写死成 F:/flutter_ohos/* 本地绝对路径，
      # macOS runner 上不存在。先转换成 pub.dev 可解析形式，并注入 OhosView
      # 占位类与 DEVELOPMENT_TEAM（占位值，--no-codesign 下不发生真实签名）。
      - name: 转换 pubspec（本地 path 依赖 -> pub.dev / 桩）
        env:
          DEVELOPMENT_TEAM_CI: 'CI00000000'
        run: python3 ci/transform_pubspec_ios.py

      - name: 拉取依赖
        run: flutter pub get

      # fluwx 的 podspec 顶部用 '/.symlinks' 反推工程根目录再调 wechat_setup.rb
      # 改写 xcodeproj/Info.plist/entitlements；CI 的 Pods 结构下推不出来会 abort。
      # 微信 iOS 配置已静态提交（Info.plist URL scheme + entitlements applinks），
      # 这里只把那段 preamble 换成固定变量声明。必须在 pub get 之后执行。
      - name: 修正 fluwx podspec（去掉依赖 Xcode 工程上下文的 preamble）
        run: python3 ci/patch_fluwx_podspec.py

      - name: 构建 iOS（未签名）
        # --build-number 取 run number，避免重复构建号；
        # --no-codesign 只生成 Pods 与配置，不签名（签名在 ios-release.yml 做）
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: 核对产物信息
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "::error::没有找到 $APP"; exit 1; }
          du -sh "$APP"
          for k in CFBundleIdentifier CFBundleName CFBundleShortVersionString MinimumOSVersion; do
            printf '%-30s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(无)"
          done

      - name: 上传未签名 App（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-runner-${{ github.run_number }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: ignore
