name: iOS Release (TestFlight)

# ---------------------------------------------------------------------------
# 目的：在没有 Mac 电脑的前提下，把 yuema 客户端签名后自动上传到 TestFlight。
#
# 密钥全部来自仓库 Secrets（本机与仓库里都不存放任何证书文件）：
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API Key 的 Issuer ID（UUID）
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API Key 的 Key ID（10 位）
#   APP_STORE_CONNECT_API_KEY     .p8 私钥的全文（含 BEGIN/END 两行）
#   APPLE_TEAM_ID                 Apple Developer 的 Team ID（10 位）
# 本 workflow 绝不打印上述任何值；.p8 只写到 runner 临时目录，任务结束即删。
#
# 签名方式：自动签名 + -allowProvisioningUpdates，由 runner 现场向苹果申请
# 证书与描述文件，用完即弃。不需要导出 .p12 / .mobileprovision。
#
# 触发：手动，或打 v* tag。刻意不挂 push 到 main（macOS runner 计费 ×10）。
#
# 前置条件（需在 Apple 后台手动完成，CI 做不到）：
#   1. developer.apple.com 注册 App ID = com.zuime.yuema
#   2. App Store Connect 创建该 App 记录（同 bundle id）
#   3. 生成 App Store Connect API Key（.p8，必须 Team Key 且 Admin 角色），
#      Key ID / Issuer ID / .p8 分别填入对应 Secrets
#   4. App Store Connect 已同意最新版协议，未签协议会拒绝上传
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  release-ios:
    name: 签名构建并上传 TestFlight
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境信息（排错用）
        run: |
          flutter --version
          echo "--- Xcode ---"
          xcodebuild -version

      # 转换本地 path 依赖；DEVELOPMENT_TEAM_CI 传真实 team id 给 pbxproj
      - name: 转换 pubspec（本地 path 依赖 -> pub.dev）
        env:
          DEVELOPMENT_TEAM_CI: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 ci/transform_pubspec_ios.py

      - name: 拉取依赖
        run: flutter pub get

      # ---------------------------------------------------------------------
      # App Store Connect API Key 落到 xcodebuild 认的目录，并做格式自检。
      # 手工粘贴 .p8 最常见错误是漏 BEGIN/END 两行，这里提前给人话报错。
      # 不打印密钥内容，只打印字节数。
      # ---------------------------------------------------------------------
      - name: 安装 App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"

          if ! head -1 "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::.p8 首行不是 -----BEGIN PRIVATE KEY-----，Secret APP_STORE_CONNECT_API_KEY 内容不完整"
            exit 1
          fi
          if ! tail -1 "$KEY" | grep -q 'END PRIVATE KEY'; then
            echo "::error::.p8 末行不是 -----END PRIVATE KEY-----，Secret APP_STORE_CONNECT_API_KEY 内容不完整"
            exit 1
          fi
          echo "密钥就位：AuthKey_${ASC_KEY_ID}.p8（$(wc -c < "$KEY") 字节）"

      # 先 --no-codesign 跑一遍：让 Flutter 生成 Generated.xcconfig 并执行
      # pod install，后面的 xcodebuild archive 才能直接用 workspace 归档。
      - name: 构建 iOS（不签名，预热 Pods 与配置）
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # ExportOptions.plist：method=app-store-connect（app-store 已废弃），
      # destination=upload —— 导出并直接上传，省掉单独调 altool。
      - name: 生成 ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          echo "ExportOptions.plist 已生成（method=app-store-connect, destination=upload）"

      - name: 归档（archive）
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: 核对归档里的版本号
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::归档里没有 Runner.app"; exit 1; }
          echo "=== 归档产物 Info.plist ==="
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '%-30s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo "(无)"
          done

      - name: 导出并上传 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # 用完就删：防止密钥在 runner 缓存里残留
      - name: 清理密钥
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/AuthKey.p8"
